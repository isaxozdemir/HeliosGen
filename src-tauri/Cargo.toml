[package]
name = "heliosgen-desktop"
version = "1.2.1"
description = "HeliosGen desktop app"
authors = ["HeliosGen"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "heliosgen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Saving a generated asset to disk: the webview ignores `<a download>`, so the
# gallery asks the user for a path (dialog) and writes the bytes itself (fs).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri dev` / `tauri build` — do not remove.
custom-protocol = ["tauri/custom-protocol"]
